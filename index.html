<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nacer Eddine Bouras — Redirecting…</title>
  <meta name="description" content="Portfolio of Nacer Eddine Bouras, Developer & Designer. Redirecting to your language." />
  <meta http-equiv="refresh" content="3; url=./en/" />
  <link rel="icon" type="image/png" href="./img/favicon.png" />
  <style>
    html{background:#000000;color:#FFFFFF;font-family:monospace;display:grid;place-items:center;min-height:100vh;margin:0}
    body{margin:0;text-align:center;padding:2rem}
    a{color:#FF0800}
    .box{border:1px solid #808080;padding:2rem 3rem;max-width:420px}
    .bar{height:4px;background:#808080;margin-top:1.5rem;overflow:hidden}
    .bar span{display:block;height:100%;width:40%;background:#FF0800;animation:slide 1s linear infinite}
    @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
  </style>
</head>
<body>
  <div class="box">
    <p>// redirecting…</p>
    <p>Choose your language:</p>
    <p>
      <a href="./en/">English</a> /
      <a href="./fr/">Français</a> /
      <a href="./ar/">العربية</a>
    </p>
    <div class="bar"><span></span></div>
  </div>
  <noscript><p>If you are not redirected, <a href="./en/">click here for English</a>.</p></noscript>
  <script>
    (function () {
      try {
        var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
        if (lang.indexOf("ar") === 0) {
          window.location.replace("./ar/");
        } else if (lang.indexOf("fr") === 0) {
          window.location.replace("./fr/");
        } else {
          window.location.replace("./en/");
        }
      } catch (e) {
        window.location.href = "./en/";
      }
    })();
  </script>
</body>
</html>
